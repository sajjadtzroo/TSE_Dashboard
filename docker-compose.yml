services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tsetmc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  proxy:
    image: ginuerzh/gost:latest
    command: -L=:8080 -F=socks5://sajjad:Trend%21%40%234@87.248.131.204:443
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tsetmc
      SCHEDULER_ENABLED: "true"
      TIMEZONE: Asia/Tehran
      BRSAPI_KEY: "BzvJaiT4ArX6NuJcVscLyhyNyTje78LC"
      OPENROUTER_API_KEY: "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"
      RAG_CHAT_MODEL: "google/gemini-2.0-flash-001"
      # Route all spider traffic through the Iran SOCKS5 proxy via gost bridge
      HTTP_PROXY: "http://proxy:8080"
      HTTPS_PROXY: "http://proxy:8080"
      http_proxy: "http://proxy:8080"
      https_proxy: "http://proxy:8080"
      # Exclude local services from proxy
      NO_PROXY: "localhost,127.0.0.1,db"
      no_proxy: "localhost,127.0.0.1,db"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  pgdata:
