services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tsetmc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tsetmc
      SCHEDULER_ENABLED: "true"
      TIMEZONE: Asia/Tehran
      BRSAPI_KEY: "BzvJaiT4ArX6NuJcVscLyhyNyTje78LC"
      OPENROUTER_API_KEY: "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"
      RAG_CHAT_MODEL: "google/gemini-2.0-flash-001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  pgdata:
