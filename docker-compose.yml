services:
  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-1.0}"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── FastAPI Application (stateless, scalable) ────────────────────────────
  app:
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_ENABLED: "true"
      SCHEDULER_ENABLED: "false"
      SERVE_STATIC: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-tsetmc}
      MINIO_SECURE: "false"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-8}"
      GUNICORN_WORKER_CONNECTIONS: "${GUNICORN_WORKER_CONNECTIONS:-1000}"
      GUNICORN_MAX_REQUESTS: "${GUNICORN_MAX_REQUESTS:-1200}"
      GUNICORN_MAX_REQUESTS_JITTER: "${GUNICORN_MAX_REQUESTS_JITTER:-100}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      TIMEZONE: ${TIMEZONE:-Asia/Tehran}
      BRSAPI_KEY: ${BRSAPI_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-google/gemini-2.0-flash-001}
      FINANCIAL_ANALYSIS_MODEL: ${FINANCIAL_ANALYSIS_MODEL:-google/gemini-2.5-flash}
      FINANCIAL_MODELING_MODEL: ${FINANCIAL_MODELING_MODEL:-anthropic/claude-opus-4.6}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (min 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      ENABLE_LOANS: ${ENABLE_LOANS:-true}
      ENABLE_CRYPTO: ${ENABLE_CRYPTO:-false}
      ENABLE_VOICE: ${ENABLE_VOICE:-false}
      CMC_API_KEY: ${CMC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-600}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-4.0}"
          memory: ${APP_MEM_LIMIT:-3G}
      replicas: ${APP_REPLICAS:-1}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # ── Scheduler Service (single instance) ──────────────────────────────────
  scheduler:
    build:
      context: .
      target: scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-tsetmc}
      MINIO_SECURE: "false"
      TIMEZONE: ${TIMEZONE:-Asia/Tehran}
      BRSAPI_KEY: ${BRSAPI_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-google/gemini-2.0-flash-001}
      ENABLE_CRYPTO: ${ENABLE_CRYPTO:-false}
      CMC_API_KEY: ${CMC_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (min 32 chars)}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time; assert time.time() - os.path.getmtime('/app/logs/scheduler.heartbeat') < 120"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${SCHEDULER_CPU_LIMIT:-1.5}"
          memory: 2G
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # ── Tick Ingestor (real-time BrsAPI → TimescaleDB) ───────────────────────
  tick_ingestor:
    build:
      context: .
      target: tick_ingestor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BRSAPI_KEY: ${BRSAPI_KEY}
      TIMEZONE: ${TIMEZONE:-Asia/Tehran}
      HTTP_PROXY: ${TICK_PROXY:-socks5://gost:1080}
      HTTPS_PROXY: ${TICK_PROXY:-socks5://gost:1080}
      NO_PROXY: localhost,127.0.0.1
      TICK_POLL_INTERVAL: ${TICK_POLL_INTERVAL:-15}
      TICK_CONCURRENCY: ${TICK_CONCURRENCY:-50}
      TICK_METRICS_PORT: "9091"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "${TICK_METRICS_PORT:-9091}:9091"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9091/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${TICK_CPU_LIMIT:-0.5}"
          memory: 256M
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── Binance WebSocket Ingestor (real-time crypto prices) ────────────────
  binance_ingestor:
    build:
      context: .
      target: binance_ingestor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443}
      BINANCE_PUBLISH_SEC: ${BINANCE_PUBLISH_SEC:-5}
      BINANCE_TICKER_SEC: ${BINANCE_TICKER_SEC:-10}
      BINANCE_CANDLE_SEC: ${BINANCE_CANDLE_SEC:-60}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time; assert time.time() - os.path.getmtime('/app/logs/binance_ingestor.heartbeat') < 120"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${BINANCE_CPU_LIMIT:-0.5}"
          memory: ${BINANCE_MEM_LIMIT:-256M}
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── PostgreSQL + TimescaleDB + pgvector ─────────────────────────────────
  db:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    shm_size: '256mb'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tsetmc}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ./data:/app/data:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-2.0}"
          memory: ${POSTGRES_MEM_LIMIT:-6G}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── PgBouncer Connection Pooler ──────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "${PGBOUNCER_POOL_SIZE:-120}"
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-2000}"
      MAX_DB_CONNECTIONS: "${PGBOUNCER_MAX_DB_CONN:-200}"
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${PGBOUNCER_CPU_LIMIT:-0.5}"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # ── MinIO Object Storage ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPU_LIMIT:-1.0}"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── Redis Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --aof-use-rdb-preamble yes
      --aof-rewrite-incremental-fsync yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1.0}"
          memory: ${REDIS_MEM_LIMIT:-2G}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # ── PostgreSQL Exporter ───────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.0
    environment:
      DATA_SOURCE_NAME: "${DOCKER_DATABASE_URL}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # ── Redis Exporter ───────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: "redis://:${REDIS_PASSWORD}@redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    depends_on:
      - tick_ingestor
      - postgres-exporter
      - redis-exporter
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-0.5}"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/tick_ingestor.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-0.5}"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # ── Dollar Rate Ingestor (real-time Telegram → TimescaleDB via Telethon) ──
  dollar_ingestor:
    build:
      context: .
      target: dollar_ingestor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-dollar_tehran3bze}
      TELEGRAM_BACKFILL: ${TELEGRAM_BACKFILL:-50}
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "${DOLLAR_CPU_LIMIT:-0.25}"
          memory: 128M
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # ── PostgreSQL Read Replica ───────────────────────────────────────────────
  db-replica:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./infra/postgres/postgresql-replica.conf:/etc/postgresql/postgresql-replica.conf:ro
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tsetmc}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PRIMARY_HOST: db
      REPLICATION_USER: replicator
      PGDATA: /var/lib/postgresql/data
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${DB_REPLICA_CPU_LIMIT:-2.0}"
          memory: ${DB_REPLICA_MEM_LIMIT:-4G}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── PgBouncer (read replica) ─────────────────────────────────────────────
  pgbouncer-replica:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL_REPLICA}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "${PGBOUNCER_REPLICA_POOL_SIZE:-80}"
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-2000}"
      MAX_DB_CONNECTIONS: "${PGBOUNCER_REPLICA_MAX_DB_CONN:-120}"
    ports:
      - "6433:5432"
    depends_on:
      db-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${PGBOUNCER_CPU_LIMIT:-0.5}"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
  pgdata-replica:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
