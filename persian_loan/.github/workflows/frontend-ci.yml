name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'banks-s3-organized/project-template/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'banks-s3-organized/project-template/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        working-directory: ['./frontend', './banks-s3-organized/project-template/frontend']

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.working-directory }}/package-lock.json'

      - name: Check if directory exists
        id: check-dir
        run: |
          if [ -d "." ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-dir.outputs.exists == 'true'
        run: npm ci

      - name: Run ESLint
        if: steps.check-dir.outputs.exists == 'true'
        run: npm run lint
        continue-on-error: false

      - name: Run TypeScript check
        if: steps.check-dir.outputs.exists == 'true'
        run: npx tsc --noEmit

      - name: Check for unused dependencies
        if: steps.check-dir.outputs.exists == 'true'
        run: |
          npx depcheck --ignores="@types/*,eslint-*,@typescript-eslint/*,@vitejs/*,vite,typescript,vitest,@vitest/*" || true
        continue-on-error: true

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        working-directory: ['./frontend', './banks-s3-organized/project-template/frontend']
        node-version: ['18', '20']

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.working-directory }}/package-lock.json'

      - name: Check if directory exists
        id: check-dir
        run: |
          if [ -d "." ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-dir.outputs.exists == 'true'
        run: npm ci

      - name: Run tests
        if: steps.check-dir.outputs.exists == 'true'
        run: npm run test:run

      - name: Run tests with coverage
        if: steps.check-dir.outputs.exists == 'true' && matrix.node-version == '20'
        run: npm run test:coverage
        continue-on-error: false

      - name: Check coverage threshold
        if: steps.check-dir.outputs.exists == 'true' && matrix.node-version == '20'
        run: |
          echo "Coverage minimum threshold: 50%"
          # Coverage is configured in vitest.config.ts
        continue-on-error: true

      - name: Upload coverage reports
        if: steps.check-dir.outputs.exists == 'true' && matrix.node-version == '20'
        uses: codecov/codecov-action@v4
        with:
          file: ${{ matrix.working-directory }}/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML report
        if: steps.check-dir.outputs.exists == 'true' && matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report-${{ hashFiles(matrix.working-directory) }}
          path: ${{ matrix.working-directory }}/coverage/

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint, test]

    strategy:
      matrix:
        working-directory: ['./frontend', './banks-s3-organized/project-template/frontend']

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.working-directory }}/package-lock.json'

      - name: Check if directory exists
        id: check-dir
        run: |
          if [ -d "." ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-dir.outputs.exists == 'true'
        run: npm ci

      - name: Build production bundle
        if: steps.check-dir.outputs.exists == 'true'
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size
        if: steps.check-dir.outputs.exists == 'true'
        run: |
          echo "Analyzing bundle size..."
          du -sh dist/
          find dist/assets -type f -name "*.js" -exec du -h {} \; | sort -rh | head -10

      - name: Upload build artifacts
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ hashFiles(matrix.working-directory) }}
          path: ${{ matrix.working-directory }}/dist/
          retention-days: 7

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    strategy:
      matrix:
        working-directory: ['./frontend', './banks-s3-organized/project-template/frontend']

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check if directory exists
        id: check-dir
        run: |
          if [ -d "." ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run npm audit
        if: steps.check-dir.outputs.exists == 'true'
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || true
          npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Upload audit report
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ hashFiles(matrix.working-directory) }}
          path: ${{ matrix.working-directory }}/npm-audit.json

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()

    steps:
      - name: Check CI results
        run: |
          echo "Frontend CI Pipeline Complete"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
