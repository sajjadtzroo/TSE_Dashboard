name: Test Suite

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./banks-s3-organized/project-template/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pytest-mock mongomock-motor
          pip install pytesseract pillow pdf2image beautifulsoup4 selenium

      - name: Run linter
        run: |
          pip install ruff black isort mypy
          ruff check app/ || true
          black --check app/ || true

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./banks-s3-organized/project-template/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./banks-s3-organized/project-template/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./banks-s3-organized/project-template/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./banks-s3-organized/project-template/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract pillow pdf2image beautifulsoup4 selenium

      - name: Run backend
        working-directory: ./banks-s3-organized/project-template/backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          DATABASE_NAME: test_db
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          sleep 10

      - name: Health check
        run: |
          curl -f http://localhost:8001/health || exit 1

      - name: Install frontend dependencies
        working-directory: ./banks-s3-organized/project-template/frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./banks-s3-organized/project-template/frontend
        run: npm run build

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python quality tools
        run: |
          pip install ruff black isort mypy

      - name: Run Black formatter check
        working-directory: ./banks-s3-organized/project-template/backend
        run: black --check app/ || true

      - name: Run isort check
        working-directory: ./banks-s3-organized/project-template/backend
        run: isort --check-only app/ || true

      - name: Run Ruff linter
        working-directory: ./banks-s3-organized/project-template/backend
        run: ruff check app/ || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./banks-s3-organized/project-template/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./banks-s3-organized/project-template/frontend
        run: npm run lint
