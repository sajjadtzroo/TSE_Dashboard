# =============================================================================
# Persian Loan Banks - TEMPLATE Docker Compose Configuration
# This is the TEMPLATE compose. For development, use root docker-compose.yml
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MongoDB Database
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: persian-loan-tpl-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MongoDB password required - set MONGO_PASSWORD environment variable}
      MONGO_INITDB_DATABASE: iranian_banks
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - persian-loan-tpl-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: persian-loan-tpl-backend
    restart: unless-stopped
    environment:
      # Database
      MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-securepassword123}@mongodb:27017
      DATABASE_NAME: ${DATABASE_NAME:-iranian_banks}

      # Application
      APP_NAME: ${APP_NAME:-Persian Loan Banks API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-true}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}

      # API
      API_PREFIX: ${API_PREFIX:-/api}

      # Python
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Hot reload for development
      - ./backend/app:/app/app:delegated
      - ./backend/tests:/app/tests:delegated
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - persian-loan-tpl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # React + Vite Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: persian-loan-tpl-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://backend:8000}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Hot reload for development
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/index.html:/app/index.html:delegated
      # Exclude node_modules from sync (performance)
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - persian-loan-tpl-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis Cache (Optional - for future use)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: persian-loan-tpl-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - persian-loan-tpl-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - cache

  # ---------------------------------------------------------------------------
  # Mongo Express (Database Admin UI)
  # ---------------------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    container_name: persian-loan-tpl-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-securepassword123}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-securepassword123}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS:-admin123}
      ME_CONFIG_SITE_BASEURL: /mongo-express/
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - persian-loan-tpl-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    profiles:
      - admin

# =============================================================================
# Networks
# =============================================================================
networks:
  persian-loan-tpl-network:
    driver: bridge
    name: persian-loan-tpl-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data:
    name: persian-loan-tpl-mongodb-data
  mongodb_config:
    name: persian-loan-tpl-mongodb-config
  redis_data:
    name: persian-loan-tpl-redis-data
