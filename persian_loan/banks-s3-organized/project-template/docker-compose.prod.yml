# =============================================================================
    # Persian Loan Banks - Docker Compose Configuration
# Production Environment
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MongoDB Database
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: persian-loan-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MongoDB username required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MongoDB password required}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-iranian_banks}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"  # Bind to localhost only
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - persian-loan-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: persian-loan-backend-prod
    restart: always
    environment:
      # Database
      MONGODB_URL: mongodb://${MONGO_USERNAME:?MongoDB username required}:${MONGO_PASSWORD:?MongoDB password required}@mongodb:27017
      DATABASE_NAME: ${DATABASE_NAME:-iranian_banks}

      # Application
      APP_NAME: ${APP_NAME:-Persian Loan Banks API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: "false"

      # CORS - Explicit origins required for security
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS origins required - set to your domain}

      # API
      API_PREFIX: ${API_PREFIX:-/api}

      # Python
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"  # Bind to localhost only
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - persian-loan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # React Frontend (Production Build with Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:?Frontend API URL required - set VITE_API_URL}
    container_name: persian-loan-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - persian-loan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: persian-loan-redis-prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - persian-loan-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    profiles:
      - cache

# =============================================================================
# Networks
# =============================================================================
networks:
  persian-loan-network:
    driver: bridge
    name: persian-loan-network-prod
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data:
    name: persian-loan-mongodb-data-prod
    driver: local
  mongodb_config:
    name: persian-loan-mongodb-config-prod
    driver: local
  redis_data:
    name: persian-loan-redis-data-prod
    driver: local
