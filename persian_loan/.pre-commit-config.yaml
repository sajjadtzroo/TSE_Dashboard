repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending

  # Python - Backend
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: black (backend)
        language_version: python3.12
        files: ^banks-s3-organized/project-template/backend/
        exclude: ^banks-s3-organized/project-template/backend/(venv|\.venv|migrations)/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (backend)
        files: ^banks-s3-organized/project-template/backend/
        exclude: ^banks-s3-organized/project-template/backend/(venv|\.venv|migrations)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        name: ruff (backend)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^banks-s3-organized/project-template/backend/
        exclude: ^banks-s3-organized/project-template/backend/(venv|\.venv|migrations)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: mypy (backend)
        files: ^banks-s3-organized/project-template/backend/app/
        exclude: ^banks-s3-organized/project-template/backend/(venv|\.venv|tests|migrations)/
        additional_dependencies:
          - types-python-dateutil
          - pydantic
        args: [--ignore-missing-imports]

  # JavaScript/TypeScript - Frontend
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: eslint (frontend main)
        files: ^frontend/.*\.(ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - '@typescript-eslint/eslint-plugin@6.21.0'
          - '@typescript-eslint/parser@6.21.0'
          - eslint-plugin-react-hooks@4.6.0
          - eslint-plugin-react-refresh@0.4.5
        args: [--fix, --max-warnings=0]

      - id: eslint
        name: eslint (frontend template)
        files: ^banks-s3-organized/project-template/frontend/.*\.(ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - '@typescript-eslint/eslint-plugin@6.21.0'
          - '@typescript-eslint/parser@6.21.0'
          - eslint-plugin-react-hooks@4.6.0
          - eslint-plugin-react-refresh@0.4.5
        args: [--fix, --max-warnings=0]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier (frontend main)
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
        exclude: ^frontend/(node_modules|dist|coverage)/

      - id: prettier
        name: prettier (frontend template)
        files: ^banks-s3-organized/project-template/frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
        exclude: ^banks-s3-organized/project-template/frontend/(node_modules|dist|coverage)/

  # Docker
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: hadolint (Dockerfile linter)
        args: [--ignore, DL3008, --ignore, DL3009, --ignore, DL3015]

  # YAML
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict, -d, '{extends: default, rules: {line-length: {max: 120}, document-start: disable}}']

  # Security - Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: bandit (security check)
        args: [-c, pyproject.toml]
        files: ^banks-s3-organized/project-template/backend/app/
        additional_dependencies: ["bandit[toml]"]

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json

# Configuration
default_language_version:
  python: python3.12
  node: "20.0.0"

# Fail fast
fail_fast: false

# Exclude patterns
exclude: |
  (?x)^(
    .*\.min\.(js|css)|
    .*\.bundle\.(js|css)|
    node_modules/.*|
    venv/.*|
    \.venv/.*|
    dist/.*|
    build/.*|
    coverage/.*|
    \.git/.*|
    migrations/.*
  )$
