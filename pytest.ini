[pytest]
pythonpath = .
# Pytest configuration for TSE Dashboard

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Coverage options
    --cov=tsetmc_scraper
    --cov=api
    --cov=database
    --cov=config
    --cov=scheduler
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    # Parallel execution (use -n auto for automatic worker count)
    -n auto
    # Strict markers
    --strict-markers
    # Show warnings
    --strict-config

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external services)
    e2e: End-to-end tests (full system)
    slow: Tests that take more than 1 second
    requires_db: Tests that require database connection
    requires_api: Tests that require external API access
    eval: RAGAS evaluation tests (require LLM API key, skip by default with -m "not eval")

# Asyncio mode
asyncio_mode = auto

# Minimum Python version
minversion = 8.0

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*
    */dist-packages/*
    */venv/*
    */env/*
    */migrations/*

[coverage:report]
precision = 2
skip_empty = True
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    def __str__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
