global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Tick ingestor real-time metrics ──────────────────────────────────────
  - job_name: tick_ingestor
    static_configs:
      - targets: ["tick_ingestor:9091"]
    metrics_path: /metrics

  # ── FastAPI application (HTTP requests, latency, error rates) ─────────────
  - job_name: api
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  # ── PostgreSQL (connections, queries, cache hit rate, replication lag) ────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Redis (memory, hit rate, connected clients, evictions) ───────────────
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
