global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Tick ingestor real-time metrics
  - job_name: tick_ingestor
    static_configs:
      - targets: ["tick_ingestor:9091"]
    metrics_path: /metrics

