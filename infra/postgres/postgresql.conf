# PostgreSQL 16 optimized configuration for TSE Dashboard
# Tuned for 4GB RAM container, SSD storage, mixed read/write workload

# ── Connection Settings ──────────────────────────────────────────────────────
listen_addresses = '*'
max_connections = 300
superuser_reserved_connections = 3

# ── Memory ───────────────────────────────────────────────────────────────────
shared_buffers = 2GB
effective_cache_size = 3GB
work_mem = 32MB
maintenance_work_mem = 256MB
huge_pages = try

# ── Write-Ahead Log ─────────────────────────────────────────────────────────
wal_level = replica                # enables streaming replication
wal_buffers = 64MB
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9

# ── Replication ───────────────────────────────────────────────────────────────
max_wal_senders = 3                # one per replica + spare
max_replication_slots = 3
wal_keep_size = 512MB              # retain WAL for lagging replicas

# ── Query Planner ────────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# ── Parallelism ──────────────────────────────────────────────────────────────
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 2

# ── Autovacuum (aggressive for high-write tables) ────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 2ms

# ── Logging ──────────────────────────────────────────────────────────────────
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ── Extensions ───────────────────────────────────────────────────────────────
# timescaledb MUST be first in shared_preload_libraries
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.track = all

# TimescaleDB tuning
timescaledb.max_background_workers = 8    # parallel chunk workers

# ── pgvector ─────────────────────────────────────────────────────────────
ivfflat.probes = 10                       # recall/speed tradeoff for ANN queries
