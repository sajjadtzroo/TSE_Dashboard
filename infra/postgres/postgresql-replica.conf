# PostgreSQL 16 — Hot Standby (read replica) configuration
# Inherits all primary tuning; only standby-specific settings differ here.

# ── Connection ────────────────────────────────────────────────────────────────
listen_addresses = '*'
max_connections = 300
superuser_reserved_connections = 3

# ── Memory (same as primary) ──────────────────────────────────────────────────
shared_buffers = 2GB
effective_cache_size = 3GB
work_mem = 32MB
maintenance_work_mem = 256MB
huge_pages = try

# ── WAL ───────────────────────────────────────────────────────────────────────
wal_buffers = 64MB

# ── Query Planner ─────────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# ── Parallelism ───────────────────────────────────────────────────────────────
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# ── Hot Standby ───────────────────────────────────────────────────────────────
hot_standby = on                      # allow read queries on replica
max_standby_streaming_delay = 30s     # cancel read query if it blocks replay for >30s
hot_standby_feedback = on             # tell primary about running queries (prevents bloat)
wal_receiver_status_interval = 10s    # heartbeat to primary

# ── Logging ───────────────────────────────────────────────────────────────────
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on

# ── Extensions ────────────────────────────────────────────────────────────────
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.track = all
timescaledb.max_background_workers = 4
