<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="داشبورد بازار بورس تهران — نمای لحظه‌ای، تحلیل تکنیکال و بنیادی" />
    <meta name="theme-color" content="#0B0E14" />
    <title>TSETMC Stock Market Dashboard</title>
    <link rel="preload" href="/fonts/pelak/Pelak-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/pelak/Pelak-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/pelak/Pelak-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Set initial color scheme from localStorage or OS preference to prevent flash
      (function() {
        var stored = localStorage.getItem('mantine-color-scheme-value');
        var scheme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        document.querySelector('meta[name="theme-color"]').content = scheme === 'light' ? '#F8FAFC' : '#0B0E14';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
