# =============================================================================
# Code Quality Tool Configuration — TSE Dashboard
# =============================================================================

# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py311", "py312"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | node_modules
  | persian_loan
  | frontend
  | alembic/versions
  | htmlcov
  | dist
  | build
)/
'''

# ── isort ────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 88
known_first_party = [
    "api",
    "rag",
    "scheduler",
    "tsetmc_scraper",
    "database",
    "config",
    "scripts",
]
skip_glob = [
    "persian_loan/*",
    "frontend/*",
    "alembic/versions/*",
    "node_modules/*",
    ".venv/*",
    "venv/*",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "node_modules",
    "persian_loan",
    "frontend",
    "alembic/versions",
    "htmlcov",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — Black handles this
    "B008",  # do not perform function calls in argument defaults — FastAPI Depends()
    "E402",  # module level import not at top — sys.path.insert pattern
    "E712",  # comparison to True/False — SQLAlchemy filter(col == True)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ are intentional re-exports

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "scripts/",
    "persian_loan/",
    "frontend/",
    "alembic/",
    "tests/",
    "htmlcov/",
]
